<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LILA — Игра Самопознания</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mukta:wght@300;400;500;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg-0: #0a0705;
    --bg-1: #14100a;
    --gold: #8a6d2a;
    --gold-mid: #a8863a;
    --brown: #3a2a18;
    --brown-deep: #1a1208;
    --text: #b89858;
    --text-dim: #7a6234;
    --line: rgba(138, 109, 42, 0.4);
    --line-soft: rgba(138, 109, 42, 0.18);
    --r-lg: 28px;
}

body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--bg-0);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

#app::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 30%, rgba(60, 42, 20, 0.4), transparent 65%),
        radial-gradient(ellipse at 50% 100%, rgba(30, 20, 10, 0.7), transparent 60%),
        linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
    z-index: -3;
}

#app::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        repeating-conic-gradient(from 0deg at 50% 50%,
            rgba(138, 109, 42, 0.045) 0deg 1deg,
            transparent 1deg 4deg),
        repeating-radial-gradient(circle at 50% 50%,
            transparent 0 30px,
            rgba(138, 109, 42, 0.035) 30px 31px);
    z-index: -2;
    pointer-events: none;
    opacity: 0.9;
}

.topbar {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 18px 20px 10px 24px;
    z-index: 5;
    position: relative;
}

.title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 8px;
    color: var(--gold-mid);
    text-shadow: 0 1px 0 rgba(0,0,0,0.7);
    line-height: 1;
    padding-left: 2px;
}

.stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-family: 'Mukta', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-left: 2px;
    margin-top: 6px;
}

.stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.stat b {
    color: var(--gold-mid);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 1px;
}

#restart {
    margin-top: 8px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    align-self: flex-start;
}

#restart:hover { color: var(--gold-mid); border-color: var(--gold); }
#restart:active { transform: scale(0.9) rotate(-180deg); }

#board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    min-height: 0;
    position: relative;
    z-index: 2;
}

#board {
    position: relative;
    width: 100%;
    max-width: min(94vw, 520px);
    aspect-ratio: 1;
    background:
        radial-gradient(circle at 50% 45%, rgba(50, 35, 18, 0.6), rgba(12, 8, 5, 0.95) 70%),
        var(--bg-1);
    border-radius: 50%;
    border: 1px solid var(--line);
    box-shadow:
        0 0 0 1px rgba(138, 109, 42, 0.1),
        0 0 0 12px rgba(10, 7, 5, 0.6),
        0 0 0 13px rgba(138, 109, 42, 0.18),
        0 20px 60px rgba(0, 0, 0, 0.75);
}

#board::before,
#board::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

#board::before { inset: 8%; border: 1px solid var(--line-soft); }
#board::after { inset: 24%; border: 1px dashed var(--line-soft); }

.cell {
    position: absolute;
    width: 8.2%;
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    transition: all 0.3s ease;
    z-index: 2;
    border: 1px solid var(--line);
    background: radial-gradient(circle at 35% 30%, var(--brown), var(--brown-deep));
    box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.7);
    overflow: hidden;
}

.cell .num {
    font-family: 'Mukta', sans-serif;
    font-weight: 500;
    font-size: 6px;
    color: rgba(180, 150, 90, 0.45);
    position: absolute;
    top: 0;
    right: 3px;
    z-index: 3;
}

.cell .sanskrit {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: clamp(7px, 1.7vw, 10px);
    color: var(--gold-mid);
    line-height: 1;
    text-align: center;
    padding: 0 1px;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9);
    pointer-events: none;
    z-index: 2;
    word-break: keep-all;
}

.cell[data-chakra="0"] { background: radial-gradient(circle at 35% 30%, #3a1e18, #180a08); border-color: rgba(120, 60, 50, 0.5); }
.cell[data-chakra="1"] { background: radial-gradient(circle at 35% 30%, #3a2618, #181008); border-color: rgba(140, 90, 40, 0.5); }
.cell[data-chakra="2"] { background: radial-gradient(circle at 35% 30%, #3a3218, #181608); border-color: rgba(140, 120, 40, 0.5); }
.cell[data-chakra="3"] { background: radial-gradient(circle at 35% 30%, #1e3a24, #0a180e); border-color: rgba(60, 120, 70, 0.5); }
.cell[data-chakra="4"] { background: radial-gradient(circle at 35% 30%, #18323a, #081218); border-color: rgba(50, 100, 130, 0.5); }
.cell[data-chakra="5"] { background: radial-gradient(circle at 35% 30%, #221a3a, #0e0818); border-color: rgba(80, 70, 140, 0.5); }
.cell[data-chakra="6"] { background: radial-gradient(circle at 35% 30%, #3a1a3a, #180818); border-color: rgba(120, 60, 130, 0.5); }
.cell[data-chakra="7"] {
    background: radial-gradient(circle at 35% 30%, #5a4420, #2a1e08);
    border-color: var(--gold-mid);
    box-shadow: inset 0 0 10px rgba(180, 140, 70, 0.25);
}

#player {
    position: absolute;
    width: 4.2%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c9a24a, #8a6d2a 55%, #4a3818);
    transform: translate(-50%, -50%);
    z-index: 10;
    transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1),
                top  0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
    box-shadow:
        0 0 0 1px rgba(180, 140, 70, 0.9),
        0 0 12px rgba(138, 109, 42, 0.7),
        0 2px 6px rgba(0, 0, 0, 0.8);
}

#player::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(138, 109, 42, 0.45);
    animation: playerHalo 3s infinite ease-in-out;
}

@keyframes playerHalo {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.15); }
}

#dice-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 22px;
    z-index: 5;
}

#dice {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: linear-gradient(145deg, #2a1f12, #14100a 60%, #0a0705);
    border: 1px solid var(--line);
    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(138, 109, 42, 0.12),
        inset 0 0 0 1px rgba(0, 0, 0, 0.5);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 12px;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
}

#dice::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 17px;
    border: 1px solid var(--line-soft);
    pointer-events: none;
}

#dice:active { transform: scale(0.96); }
#dice.rolling { animation: roll 0.5s linear; }
#dice:disabled { opacity: 0.4; cursor: not-allowed; }

@keyframes roll {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(90deg) scale(0.94); }
    50% { transform: rotate(180deg) scale(1.06); }
    75% { transform: rotate(270deg) scale(0.94); }
    100% { transform: rotate(360deg) scale(1); }
}

.pip {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a8863a, #6b521e 60%, #3a2a10);
    box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.6);
}

.pip.empty { background: transparent; box-shadow: none; }

#dice-label {
    font-family: 'Mukta', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
}

#modal {
    position: fixed;
    inset: 0;
    background: rgba(5, 3, 2, 0.9);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 100;
}

#modal.show { opacity: 1; pointer-events: auto; }

.modal-card {
    max-width: 400px;
    width: 100%;
    background: linear-gradient(180deg, #1e1710, #0f0a06);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 34px 28px 30px;
    text-align: center;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(138, 109, 42, 0.1),
        inset 0 1px 0 rgba(138, 109, 42, 0.08);
    transform: scale(0.94) translateY(12px);
    transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.5, 1);
    position: relative;
}

.modal-card::before,
.modal-card::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
}

.modal-card::before { top: 16px; }
.modal-card::after { bottom: 16px; }

#modal.show .modal-card { transform: scale(1) translateY(0); }

.modal-sanskrit {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: 34px;
    color: var(--gold-mid);
    margin-bottom: 14px;
    line-height: 1.1;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9);
}

.modal-title {
    font-family: 'Mukta', sans-serif;
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 18px;
}

.modal-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    line-height: 1.7;
    color: var(--text);
    font-style: italic;
    margin-bottom: 22px;
    padding: 0 4px;
}

.modal-move {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-style: italic;
    color: var(--gold);
    margin-bottom: 26px;
}

.modal-btn {
    padding: 14px 40px;
    background: transparent;
    border: 1px solid var(--gold);
    border-radius: 40px;
    color: var(--gold-mid);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
}

.modal-btn:hover { background: rgba(138, 109, 42, 0.12); color: #c9a24a; }
.modal-btn:active { transform: scale(0.97); background: rgba(138, 109, 42, 0.2); }

#chakra-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 6px 0 10px;
}

.chakra-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transition: all 0.35s ease;
    opacity: 0.25;
    border: 1px solid rgba(180, 140, 70, 0.2);
}

.chakra-dot.active {
    opacity: 1;
    transform: scale(1.6);
    border-color: transparent;
}

@media (max-height: 700px) {
    #dice { width: 62px; height: 62px; padding: 10px; border-radius: 19px; }
    .modal-sanskrit { font-size: 26px; }
    .modal-card { padding: 24px 22px; border-radius: 22px; }
    .modal-text { font-size: 15px; }
    .topbar { padding: 12px 16px 6px 20px; gap: 4px; }
    .title { font-size: 28px; letter-spacing: 7px; }
    #dice-wrap { padding: 6px 16px 16px; gap: 8px; }
}
</style>
</head>
<body>

<div id="app">
    <div class="topbar">
        <div class="title">LILA</div>
        <div class="stats">
            <div class="stat">Клетка <b id="pos">1</b></div>
            <div class="stat">Ход <b id="turns">0</b></div>
        </div>
        <button id="restart" title="Новая игра">↻</button>
    </div>

    <div id="board-wrap">
        <div id="board"></div>
    </div>

    <div id="chakra-bar"></div>

    <div id="dice-wrap">
        <div id="dice" role="button" aria-label="Бросить кубик"></div>
        <div id="dice-label">Бросьте кубик</div>
    </div>
</div>

<div id="modal">
    <div class="modal-card">
        <div class="modal-sanskrit" id="mSanskrit"></div>
        <div class="modal-title" id="mTitle">Клетка</div>
        <div class="modal-text" id="mText"></div>
        <div class="modal-move" id="mMove"></div>
        <button class="modal-btn" id="mBtn">Продолжить</button>
    </div>
</div>

let state = { pos: 1, turns: 0, rolling: false, finished: false };

let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
}

function playWoodKnock(delay, intensity) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const dur = 0.13;
    const buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        const n = i / data.length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - n, 4);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const modes = [
        { freq: 210, q: 7,  gain: 1.0 },
        { freq: 380, q: 9,  gain: 0.75 },
        { freq: 620, q: 10, gain: 0.5 },
        { freq: 920, q: 12, gain: 0.3 },
    ];
    const master = ctx.createGain();
    master.gain.value = intensity * 0.55;
    const body = ctx.createBiquadFilter();
    body.type = 'lowpass';
    body.frequency.value = 1800;
    body.Q.value = 0.6;
    modes.forEach(m => {
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = m.freq;
        bp.Q.value = m.q;
        const g = ctx.createGain();
        g.gain.value = m.gain;
        src.connect(bp).connect(g).connect(body);
    });
    const click = ctx.createBiquadFilter();
    click.type = 'highpass';
    click.frequency.value = 2200;
    const clickGain = ctx.createGain();
    clickGain.gain.value = 0.08;
    src.connect(click).connect(clickGain).connect(body);
    body.connect(master).connect(ctx.destination);
    src.start(t);
    src.stop(t + dur);
}

function playDiceRollSound() {
    playWoodKnock(0.00, 1.0);
    playWoodKnock(0.10, 0.6);
    playWoodKnock(0.19, 0.35);
    playWoodKnock(0.28, 0.18);
    playWoodKnock(0.38, 0.09);
}

/* ============================================================
   АРХИМЕДОВА СПИРАЛЬ — 6 витков, ровный шаг, клетки не налезают
   ============================================================ */
function spiralPositions(n) {
    const result = [];
    const turns = 6;
    const rStart = 46;
    const rEnd = 7;
    const totalAngle = turns * Math.PI * 2;

    for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const angle = t * totalAngle - Math.PI / 2;
        const radius = rStart - t * (rStart - rEnd);
        const x = 50 + Math.cos(angle) * radius;
        const y = 50 + Math.sin(angle) * radius;
        result.push({ x, y });
    }
    return result;
}

function getChakra(cellNum) {
    return Math.min(7, Math.floor((cellNum - 1) / 9));
}

function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    const positions = spiralPositions(TOTAL_CELLS);

    for (let i = 1; i <= TOTAL_CELLS; i++) {
        const pos = positions[i - 1];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.cell = i;

        const chakra = getChakra(i);
        cell.dataset.chakra = chakra;
        cell.style.left = pos.x + '%';
        cell.style.top = pos.y + '%';

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = i;
        cell.appendChild(num);

        if (CELLS[i] && CELLS[i].sanskrit) {
            const sk = document.createElement('span');
            sk.className = 'sanskrit';
            sk.textContent = CELLS[i].sanskrit;
            cell.appendChild(sk);
        }

        board.appendChild(cell);
    }

    const player = document.createElement('div');
    player.id = 'player';
    board.appendChild(player);

    updatePlayerPosition();
    buildChakraBar();
}

function updatePlayerPosition() {
    const player = document.getElementById('player');
    if (!player) return;
    const cell = document.querySelector('.cell[data-cell="' + state.pos + '"]');
    if (!cell) return;
    player.style.left = cell.style.left;
    player.style.top = cell.style.top;
}

function buildChakraBar() {
    const bar = document.getElementById('chakra-bar');
    bar.innerHTML = '';
    CHAKRAS.forEach((ch, i) => {
        const dot = document.createElement('div');
        dot.className = 'chakra-dot';
        dot.style.background = ch.color;
        dot.style.color = ch.color;
        dot.dataset.chakra = i;
        bar.appendChild(dot);
    });
    updateChakraBar();
}

function updateChakraBar() {
    const cur = getChakra(state.pos);
    document.querySelectorAll('.chakra-dot').forEach(d => {
        d.classList.toggle('active', +d.dataset.chakra === cur);
    });
}

function renderDice(value) {
    const dice = document.getElementById('dice');
    dice.innerHTML = '';
    const layouts = {
        1: [4], 2: [0, 8], 3: [0, 4, 8],
        4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8],
    };
    const pips = layouts[value] || [];
    for (let i = 0; i < 9; i++) {
        const p = document.createElement('div');
        p.className = 'pip' + (pips.includes(i) ? '' : ' empty');
        dice.appendChild(p);
    }
}

function rollDice() {
    if (state.rolling || state.finished) return;
    ensureAudio();
    state.rolling = true;
    const dice = document.getElementById('dice');
    dice.disabled = true;
    dice.classList.add('rolling');

    playDiceRollSound();

    let ticks = 0;
    const interval = setInterval(() => {
        renderDice(Math.floor(Math.random() * 6) + 1);
        ticks++;
        if (ticks > 8) {
            clearInterval(interval);
            finishRoll();
        }
    }, 60);
}

function finishRoll() {
    const dice = document.getElementById('dice');
    dice.classList.remove('rolling');
    const value = Math.floor(Math.random() * 6) + 1;
    renderDice(value);
    document.getElementById('dice-label').textContent = 'Выпало ' + value;
    state.turns++;
    document.getElementById('turns').textContent = state.turns;
    animateMove(value, () => handleLanding());
}

/* ============================================================
   ПОШАГОВАЯ АНИМАЦИЯ — ровно по кубику, клетка за клеткой
   ============================================================ */
function animateMove(steps, cb) {
    let remaining = steps;
    const stepDur = 300;

    const step = () => {
        if (remaining <= 0) { cb(); return; }
        if (state.pos >= TOTAL_CELLS) { cb(); return; }

        const next = state.pos + 1;
        if (next > TOTAL_CELLS) { cb(); return; }

        state.pos = next;
        updatePlayerPosition();
        updateChakraBar();
        document.getElementById('pos').textContent = state.pos;

        if (state.pos === TOTAL_CELLS) {
            remaining = 0;
            setTimeout(() => {
                state.rolling = false;
                document.getElementById('dice').disabled = false;
                showFinal();
            }, stepDur + 100);
            return;
        }

        remaining--;
        setTimeout(step, stepDur);
    };

    step();
}

function handleLanding() {
    const cell = CELLS[state.pos];
    if (!cell) {
        state.rolling = false;
        document.getElementById('dice').disabled = false;
        return;
    }

    if (cell.snake) {
        showModal({
            title: 'Змея — ' + cell.name,
            sanskrit: cell.sanskrit,
            text: cell.text,
            move: cell.snk,
            color: '#7a4038',
            then: () => {
                state.pos = cell.snake;
                updatePlayerPosition();
                updateChakraBar();
                document.getElementById('pos').textContent = state.pos;
                state.rolling = false;
                document.getElementById('dice').disabled = false;
            }
        });
        return;
    }
    if (cell.ladder) {
        showModal({
            title: 'Стрела — ' + cell.name,
            sanskrit: cell.sanskrit,
            text: cell.text,
            move: cell.lad,
            color: '#4a7050',
            then: () => {
                state.pos = cell.ladder;
                updatePlayerPosition();
                updateChakraBar();
                document.getElementById('pos').textContent = state.pos;
                state.rolling = false;
                document.getElementById('dice').disabled = false;
            }
        });
        return;
    }

    showModal({
        title: 'Клетка ' + state.pos + ' — ' + cell.name,
        sanskrit: cell.sanskrit,
        text: cell.text,
        move: '',
        color: CHAKRAS[getChakra(state.pos)].color,
        then: () => {
            state.rolling = false;
            document.getElementById('dice').disabled = false;
        }
    });
}

let modalCallback = null;

function showModal({ title, text, move, color, sanskrit, then }) {
    document.getElementById('mSanskrit').textContent = sanskrit || '';
    document.getElementById('mSanskrit').style.color = color || '#a8863a';
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mTitle').style.color = color || '#7a6234';
    document.getElementById('mText').textContent = text;
    document.getElementById('mMove').textContent = move || '';
    document.getElementById('mMove').style.color = color || '#8a6d2a';
    modalCallback = then || null;
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    const cb = modalCallback;
    modalCallback = null;
    if (cb) setTimeout(cb, 300);
}

function showFinal() {
    state.finished = true;
    state.rolling = false;
    showModal({
        title: 'Освобождение',
        sanskrit: 'मोक्ष',
        text: 'Вы прошли все 72 клетки игры Lila. Игра завершена — но путь продолжается в жизни.',
        move: 'नमस्ते',
        color: '#a8863a',
        then: () => {
            document.getElementById('dice').disabled = true;
            document.getElementById('dice-label').textContent = 'Игра завершена';
        }
    });
}

function newGame() {
    state = { pos: 1, turns: 0, rolling: false, finished: false };
    document.getElementById('pos').textContent = 1;
    document.getElementById('turns').textContent = 0;
    document.getElementById('dice').disabled = false;
    document.getElementById('dice-label').textContent = 'Бросьте кубик';
    renderDice(1);
    updatePlayerPosition();
    updateChakraBar();
    document.getElementById('modal').classList.remove('show');
    modalCallback = null;
}

document.getElementById('dice').addEventListener('click', rollDice);
document.getElementById('mBtn').addEventListener('click', closeModal);
document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
});

if (window.vkBridge) {
    vkBridge.send('VKWebAppInit').catch(() => {});
    vkBridge.send('VKWebAppExpand').catch(() => {});
}

buildBoard();
renderDice(1);
</script>
