<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LEELA GAME</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
    --bg-0: #1a1208; --bg-1: #241810;
    --gold: #b08a34; --gold-mid: #d4a94e; --gold-bright: #e8c46a; --gold-pale: #f0d488;
    --text: #e0c084; --text-dim: #b89858;
    --line: rgba(176, 138, 52, 0.55); --line-soft: rgba(176, 138, 52, 0.25);
}
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Cormorant Garamond', Georgia, serif; background: var(--bg-0); color: var(--text); user-select: none; -webkit-font-smoothing: antialiased; }
#app { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }
#sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 24px 20px; background: linear-gradient(180deg, rgba(20, 16, 10, 0.95), rgba(10, 7, 5, 0.98)); z-index: 5; }
#sidebar .top-block { display: flex; flex-direction: column; gap: 8px; width: 100%; }

.title { display: flex; flex-direction: column; align-items: flex-start; width: 100%; margin-bottom: 12px; padding-left: 4px; }
.title .sanskrit-line, .title .latin-line { display: block; text-align: left; color: var(--gold-bright); line-height: 1; text-shadow: 0 0 4px rgba(232, 196, 106, 0.7), 0 0 14px rgba(212, 169, 78, 0.4), 0 1px 0 rgba(0, 0, 0, 0.9); white-space: nowrap; }
.title .sanskrit-line { font-family: 'Tiro Devanagari Sanskrit', 'Noto Sans Devanagari', serif; font-size: 46px; letter-spacing: 10px; margin-bottom: 2px; }
.title .latin-line { font-family: 'Yatra One', 'Baloo 2', sans-serif; font-size: 24px; letter-spacing: 8px; color: var(--gold-pale); text-shadow: 0 0 3px rgba(240, 212, 136, 0.7), 0 0 10px rgba(212, 169, 78, 0.4), 0 1px 0 rgba(0, 0, 0, 0.9); }

.stats { display: flex; flex-direction: column; gap: 6px; font-family: 'Mukta', sans-serif; font-size: 14px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--text-dim); padding-left: 4px; margin-top: 8px; }
.stat { display: flex; align-items: baseline; gap: 10px; }
.stat b { color: var(--gold-bright); font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 19px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(212, 169, 78, 0.4); }

#chakra-bar { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; padding-left: 4px; }
.chakra-dot { width: 9px; height: 9px; border-radius: 50%; transition: all 0.35s ease; opacity: 0.3; border: 1px solid rgba(212, 169, 78, 0.3); }
.chakra-dot.active { opacity: 1; transform: scale(1.8); border-color: transparent; box-shadow: 0 0 12px currentColor; }

#restart { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(200, 165, 100, 0.5); background: transparent; color: #c9a86a; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; margin-top: 16px; margin-left: 4px; }
#restart:hover { color: var(--gold-bright); border-color: var(--gold); }
#restart:active { transform: scale(0.9) rotate(-180deg); }
#restart:disabled { opacity: 0.4; cursor: not-allowed; }

#board-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; min-width: 0;
    position: relative; z-index: 2;
    background:
        radial-gradient(ellipse at 50% 40%, rgba(220, 195, 150, 0.15), transparent 70%),
        radial-gradient(ellipse at 50% 100%, rgba(60, 40, 20, 0.5), transparent 60%),
        linear-gradient(180deg, #1a1208 0%, #241810 50%, #1a1208 100%);
}
#board { position: relative; height: 100%; max-height: calc(100vh - 40px); aspect-ratio: 1 / 1; background-image: url('lila-board.jpg'); background-size: contain; background-repeat: no-repeat; background-position: center; border-radius: 12px; box-shadow: 0 0 0 1px rgba(176, 138, 52, 0.25), 0 20px 60px rgba(0, 0, 0, 0.85); }

.cell {
    position: absolute; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    border: none;
    background: transparent;
    box-shadow: none;
    transition: none;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; pointer-events: none;
}
.cell .num { display: none; }
.cell.center-core { background: transparent; box-shadow: none; }
.cell.start-finish { background: transparent; box-shadow: none; }
.cell.trap { background: transparent; box-shadow: none; }

#player {
    position: absolute;
    width: 7.5%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: 20;
    transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1),
                top 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
    background: transparent;
    box-shadow: none;
}
#player svg {
    width: 100%;
    height: 100%;
    display: block;
}

#dice-panel { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 20px; background: linear-gradient(180deg, rgba(20, 16, 10, 0.95), rgba(10, 7, 5, 0.98)); z-index: 5; }
#dice { width: 86px; height: 86px; border-radius: 26px; background: linear-gradient(145deg, #2a1f12, #14100a 60%, #0a0705); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(212, 169, 78, 0.15), inset 0 1px 0 rgba(212, 169, 78, 0.2); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 14px; gap: 5px; cursor: pointer; transition: all 0.2s; position: relative; }
#dice::before { content: ''; position: absolute; inset: 6px; border-radius: 20px; border: 1px solid var(--line-soft); pointer-events: none; }
#dice:active { transform: scale(0.96); }
#dice.rolling { animation: roll 0.5s linear; }
#dice:disabled { opacity: 0.4; cursor: not-allowed; }
@keyframes roll { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(90deg) scale(0.94); } 50% { transform: rotate(180deg) scale(1.06); } 75% { transform: rotate(270deg) scale(0.94); } 100% { transform: rotate(360deg) scale(1); } }
.pip { width: 100%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f0d488, #a8863a 60%, #4a3818); box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.6); }
.pip.empty { background: transparent; box-shadow: none; }
#dice-label { font-family: 'Mukta', sans-serif; font-size: 13px; letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); min-height: 20px; }

#modal { position: fixed; inset: 0; background: rgba(5, 3, 2, 0.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; z-index: 100; }
#modal.show { opacity: 1; pointer-events: auto; }
.modal-card { max-width: 420px; width: 100%; background: linear-gradient(180deg, #241c12, #0f0a06); border: 1px solid var(--line); border-radius: 28px; padding: 42px 34px 38px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(212, 169, 78, 0.15), inset 0 1px 0 rgba(212, 169, 78, 0.12); transform: scale(0.94) translateY(12px); transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.5, 1); }
#modal.show .modal-card { transform: scale(1) translateY(0); }
.modal-sanskrit { font-family: 'Tiro Devanagari Sanskrit', 'Noto Sans Devanagari', serif; font-size: 44px; color: var(--gold-bright); margin-bottom: 16px; line-height: 1.1; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 20px rgba(212, 169, 78, 0.3); }
.modal-title { font-family: 'Mukta', sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 4.8px; color: var(--text); text-transform: uppercase; margin-bottom: 20px; }
.modal-text { font-family: 'Cormorant Garamond', serif; font-size: 21px; line-height: 1.7; color: var(--text); font-style: italic; margin-bottom: 24px; }
.modal-move { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: var(--gold-bright); margin-bottom: 28px; }
.modal-btn { padding: 16px 46px; background: transparent; border: 1px solid var(--gold); border-radius: 40px; color: var(--gold-bright); font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 4.8px; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; }
.modal-btn:hover { background: rgba(212, 169, 78, 0.15); }
.modal-btn:active { transform: scale(0.97); }

#music-toggle { position: fixed; right: 240px; bottom: 24px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 16, 10, 0.85); color: var(--text-dim); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; z-index: 60; }
#music-toggle:hover { color: var(--gold-bright); border-color: var(--gold); }
#music-toggle.muted { opacity: 0.5; }

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 900px), (orientation: portrait) {
    #app { 
        flex-direction: column; 
        height: 100dvh;
    }
    
    /* Верхняя панель — компактная */
    #sidebar { 
        width: 100%; 
        flex-direction: row; 
        align-items: center; 
        justify-content: space-between; 
        padding: 8px 12px;
        flex-shrink: 0;
        min-height: 52px;
    }
    #sidebar .top-block { 
        flex-direction: row; 
        align-items: center; 
        gap: 12px;
        flex-wrap: nowrap;
    }
    .title { margin-bottom: 0; width: auto; }
    .title .sanskrit-line { font-size: 20px; letter-spacing: 4px; }
    .title .latin-line { font-size: 11px; letter-spacing: 3px; }
    .stats { flex-direction: row; gap: 12px; font-size: 11px; padding-left: 0; margin-top: 0; }
    .stat b { font-size: 14px; }
    #chakra-bar { display: none; }
    #restart { width: 32px; height: 32px; font-size: 14px; margin-top: 0; margin-left: 0; }
    
    /* Игровое поле — занимает всё доступное место */
    #board-wrap { 
        flex: 1; 
        padding: 6px; 
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #board { 
        width: 100%;
        height: 100%;
        max-height: none;
        max-width: none;
        aspect-ratio: 1 / 1;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: 8px;
    }
    
    /* Нижняя панель с кубиком — по центру */
    #dice-panel { 
        width: 100%; 
        flex-direction: row; 
        justify-content: center; 
        align-items: center;
        gap: 16px; 
        padding: 10px 16px 14px;
        flex-shrink: 0;
        min-height: 80px;
    }
    #dice { 
        width: 68px; 
        height: 68px; 
        padding: 10px; 
        border-radius: 20px; 
    }
    #dice-label { 
        font-size: 11px; 
        letter-spacing: 2px; 
        min-height: auto;
    }
    
    .modal-sanskrit { font-size: 34px; }
    .modal-card { padding: 30px 24px; border-radius: 22px; }
    .modal-text { font-size: 18px; }
    #music-toggle { right: 16px; bottom: 90px; width: 38px; height: 38px; font-size: 16px; }
}
</style>
</head>

<div id="app">
    <div id="sidebar">
        <div class="top-block">
            <div class="title">
                <span class="sanskrit-line">लीला</span>
                <span class="latin-line">LEELA</span>
            </div>
            <div class="stats">
                <div class="stat">Клетка <b id="pos">68</b></div>
                <div class="stat">Ход <b id="turns">0</b></div>
            </div>
            <div id="chakra-bar"></div>
        </div>
        <button id="restart" title="Новая игра">↻</button>
    </div>

    <div id="board-wrap">
        <div id="board"></div>
    </div>

    <div id="dice-panel">
        <div id="dice" role="button" aria-label="Бросить кубик"></div>
        <div id="dice-label">Бросьте 6</div>
    </div>
</div>

<button id="music-toggle" title="Музыка">♪</button>

<div id="modal">
    <div class="modal-card">
        <div class="modal-sanskrit" id="mSanskrit"></div>
        <div class="modal-title" id="mTitle">Клетка</div>
        <div class="modal-text" id="mText"></div>
        <div class="modal-move" id="mMove"></div>
        <button class="modal-btn" id="mBtn">Продолжить</button>
    </div>
</div>

<audio id="bg-music" src="1.mp3" loop preload="auto"></audio>

const bgMusic = document.getElementById('bg-music');
const musicToggle = document.getElementById('music-toggle');
let musicStarted = false;
function tryPlayMusic() { if (!bgMusic) return; bgMusic.volume = 0.5; const p = bgMusic.play(); if (p && p.catch) { p.then(() => { musicStarted = true; musicToggle.classList.remove('muted'); }).catch(() => { musicStarted = false; musicToggle.classList.add('muted'); }); } }
tryPlayMusic();
function unlockMusic() { if (!musicStarted) tryPlayMusic(); document.removeEventListener('click', unlockMusic); document.removeEventListener('touchstart', unlockMusic); document.removeEventListener('keydown', unlockMusic); }
document.addEventListener('click', unlockMusic); document.addEventListener('touchstart', unlockMusic); document.addEventListener('keydown', unlockMusic);
musicToggle.addEventListener('click', (e) => { e.stopPropagation(); if (bgMusic.paused) tryPlayMusic(); else { bgMusic.pause(); musicToggle.classList.add('muted'); } });

if (window.vkBridge) { vkBridge.send('VKWebAppInit').catch(() => {}); vkBridge.send('VKWebAppExpand').catch(() => {}); }

let state = { pos: START_CELL, turns: 0, rolling: false, finished: false, entered: false, sixStreak: 0, pendingMove: 0 };

let audioCtx = null;
function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); return audioCtx; }
function playWoodKnock(delay, intensity) {
    const ctx = ensureAudio(); if (!ctx) return;
    const t = ctx.currentTime + delay; const dur = 0.13;
    const buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) { const n = i / data.length; data[i] = (Math.random() * 2 - 1) * Math.pow(1 - n, 4); }
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const modes = [ { freq: 210, q: 7, gain: 1.0 }, { freq: 380, q: 9, gain: 0.75 }, { freq: 620, q: 10, gain: 0.5 }, { freq: 920, q: 12, gain: 0.3 } ];
    const master = ctx.createGain(); master.gain.value = intensity * 0.55;
    const body = ctx.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 1800; body.Q.value = 0.6;
    modes.forEach(m => { const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = m.freq; bp.Q.value = m.q; const g = ctx.createGain(); g.gain.value = m.gain; src.connect(bp).connect(g).connect(body); });
    body.connect(master).connect(ctx.destination); src.start(t); src.stop(t + dur);
}
function playDiceRollSound() { playWoodKnock(0.00, 1.0); playWoodKnock(0.10, 0.6); playWoodKnock(0.19, 0.35); playWoodKnock(0.28, 0.18); playWoodKnock(0.38, 0.09); }

function getChakra(cellNum) { return Math.min(7, Math.floor((cellNum - 1) / 9)); }

let maskIdCounter = 0;

function buildBoard() {
    const board = document.getElementById('board'); board.innerHTML = '';
    for (let i = 1; i <= TOTAL_CELLS; i++) {
        const pos = CELL_POSITIONS[i - 1];
        const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.cell = i;
        cell.style.left = pos.x + '%'; cell.style.top = pos.y + '%'; cell.style.width = '3.4%';
        if (i === START_CELL) cell.classList.add('start-finish');
        if (TRAP_CELLS.includes(i)) cell.classList.add('trap');
        board.appendChild(cell);
    }

    const player = document.createElement('div');
    player.id = 'player';
    const mid = 'omMask_' + (maskIdCounter++);
    player.innerHTML = `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <defs>
                <mask id="${mid}" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
                    <rect x="0" y="0" width="100" height="100" fill="white"/>
                    <text x="50" y="76"
                          text-anchor="middle"
                          font-family="Tiro Devanagari Sanskrit, Noto Sans Devanagari, serif"
                          font-size="72"
                          font-weight="400"
                          fill="black">ॐ</text>
                </mask>
            </defs>
            <circle cx="50" cy="50" r="50" fill="#c93a3a" mask="url(#${mid})"/>
        </svg>`;
    board.appendChild(player);

    updatePlayerPosition(); buildChakraBar();
}
function updatePlayerPosition() { const player = document.getElementById('player'); if (!player) return; const pos = CELL_POSITIONS[state.pos - 1]; if (!pos) return; player.style.left = pos.x + '%'; player.style.top = pos.y + '%'; }
function buildChakraBar() { const bar = document.getElementById('chakra-bar'); bar.innerHTML = ''; CHAKRAS.forEach((ch, i) => { const dot = document.createElement('div'); dot.className = 'chakra-dot'; dot.style.background = ch.color; dot.style.color = ch.color; dot.dataset.chakra = i; bar.appendChild(dot); }); updateChakraBar(); }
function updateChakraBar() { const cur = getChakra(state.pos); document.querySelectorAll('.chakra-dot').forEach(d => { d.classList.toggle('active', +d.dataset.chakra === cur); }); }

function renderDice(value) {
    const dice = document.getElementById('dice'); dice.innerHTML = '';
    const layouts = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const pips = layouts[value] || [];
    for (let i = 0; i < 9; i++) { const p = document.createElement('div'); p.className = 'pip' + (pips.includes(i) ? '' : ' empty'); dice.appendChild(p); }
}
function rollDice() {
    if (state.rolling || state.finished) return;
    ensureAudio(); state.rolling = true;
    const dice = document.getElementById('dice'); dice.disabled = true; dice.classList.add('rolling'); playDiceRollSound();
    let ticks = 0;
    const interval = setInterval(() => { renderDice(Math.floor(Math.random() * 6) + 1); ticks++; if (ticks > 8) { clearInterval(interval); finishRoll(); } }, 60);
}
function finishRoll() {
    const dice = document.getElementById('dice'); dice.classList.remove('rolling');
    const value = Math.floor(Math.random() * 6) + 1; renderDice(value);
    state.turns++; document.getElementById('turns').textContent = state.turns;

    if (!state.entered) {
        if (value === 6) {
            state.entered = true; state.sixStreak = 1;
            document.getElementById('dice-label').textContent = 'Выпало 6 — Рождение!';
            setTimeout(() => {
                state.pos = 1; updatePlayerPosition(); document.getElementById('pos').textContent = state.pos;
                setTimeout(() => {
                    state.pos = ENTRY_CELL; updatePlayerPosition(); updateChakraBar(); document.getElementById('pos').textContent = state.pos;
                    state.rolling = false; dice.disabled = false; document.getElementById('dice-label').textContent = 'Бросьте кубик'; handleLanding();
                }, 500);
            }, 300);
        } else { document.getElementById('dice-label').textContent = 'Выпало ' + value + '. Нужно 6'; state.rolling = false; dice.disabled = false; }
        return;
    }

    if (value === 6) {
        state.sixStreak++;
        if (state.sixStreak >= 3) { state.pendingMove = 0; state.sixStreak = 0; document.getElementById('dice-label').textContent = 'Три 6 — сгорают!'; state.rolling = false; dice.disabled = false; return; }
        else { state.pendingMove += 6; document.getElementById('dice-label').textContent = '6! Бросайте ещё'; state.rolling = false; dice.disabled = false; return; }
    }
    const totalMove = state.pendingMove + value; state.pendingMove = 0; state.sixStreak = 0;
    document.getElementById('dice-label').textContent = 'Выпало ' + value;
    animateMove(totalMove, () => handleLanding());
}

function animateMove(steps, cb) {
    let remaining = steps; 
    const stepDur = 280;
    
    const step = () => {
        if (remaining <= 0) { 
            cb(); 
            return; 
        }
        
        const next = state.pos + 1;
        
        if (state.pos < 68 && next > 68) {
            state.pos = 72;
            updatePlayerPosition(); 
            updateChakraBar(); 
            document.getElementById('pos').textContent = state.pos;
            cb();
            return;
        }
        
        if (next === 68) {
            state.pos = next; 
            updatePlayerPosition(); 
            updateChakraBar(); 
            document.getElementById('pos').textContent = state.pos;
            setTimeout(() => { 
                state.rolling = false; 
                document.getElementById('dice').disabled = false; 
                showFinal(); 
            }, stepDur + 100);
            return;
        }
        
        state.pos = next; 
        updatePlayerPosition(); 
        updateChakraBar(); 
        document.getElementById('pos').textContent = state.pos;
        
        remaining--; 
        setTimeout(step, stepDur);
    };
    step();
}

function handleLanding() {
    if (TRAP_CELLS.includes(state.pos)) {
        showModal({ title: 'Ловушка — ' + state.pos, sanskrit: CELLS[state.pos].sanskrit, text: CELLS[state.pos].text, move: 'Вернитесь на 68', color: '#c96a5a', then: () => { state.pos = START_CELL; updatePlayerPosition(); updateChakraBar(); document.getElementById('pos').textContent = state.pos; state.rolling = false; document.getElementById('dice').disabled = false; } });
        return;
    }
    const cell = CELLS[state.pos];
    if (!cell) { state.rolling = false; document.getElementById('dice').disabled = false; return; }
    
    if (state.pos === 72 && SNAKES[72]) {
        const to = SNAKES[72];
        showModal({ 
            title: 'Змея — ' + cell.name, 
            sanskrit: cell.sanskrit, 
            text: cell.text, 
            move: 'Змея возвращает на Землю (51) для нового круга', 
            color: '#c96a5a', 
            then: () => { 
                state.pos = to; 
                updatePlayerPosition(); 
                updateChakraBar(); 
                document.getElementById('pos').textContent = state.pos;
                const cell51 = CELLS[state.pos];
                showModal({ 
                    title: 'Клетка ' + state.pos + ' — ' + cell51.name, 
                    sanskrit: cell51.sanskrit, 
                    text: cell51.text, 
                    move: '', 
                    color: CHAKRAS[getChakra(state.pos)].color, 
                    then: () => { state.rolling = false; document.getElementById('dice').disabled = false; } 
                });
            } 
        });
        return;
    }
    
    if (SNAKES[state.pos]) {
        const to = SNAKES[state.pos];
        showModal({ title: 'Змея — ' + cell.name, sanskrit: cell.sanskrit, text: cell.text, move: 'Змея утянула на клетку ' + to, color: '#c96a5a', then: () => { state.pos = to; updatePlayerPosition(); updateChakraBar(); document.getElementById('pos').textContent = state.pos; state.rolling = false; document.getElementById('dice').disabled = false; } });
        return;
    }
    if (LADDERS[state.pos]) {
        const to = LADDERS[state.pos];
        showModal({ title: 'Стрела — ' + cell.name, sanskrit: cell.sanskrit, text: cell.text, move: 'Стрела возносит на клетку ' + to, color: '#6ab07a', then: () => { state.pos = to; updatePlayerPosition(); updateChakraBar(); document.getElementById('pos').textContent = state.pos; state.rolling = false; document.getElementById('dice').disabled = false; } });
        return;
    }
    
    showModal({ title: 'Клетка ' + state.pos + ' — ' + cell.name, sanskrit: cell.sanskrit, text: cell.text, move: '', color: CHAKRAS[getChakra(state.pos)].color, then: () => { state.rolling = false; document.getElementById('dice').disabled = false; } });
}

let modalCallback = null;
function showModal({ title, text, move, color, sanskrit, then }) {
    document.getElementById('mSanskrit').textContent = sanskrit || ''; document.getElementById('mSanskrit').style.color = color || '#d4a94e';
    document.getElementById('mTitle').textContent = title; document.getElementById('mTitle').style.color = '#e0c084';
    document.getElementById('mText').textContent = text; document.getElementById('mMove').textContent = move || ''; document.getElementById('mMove').style.color = color || '#d4a94e';
    modalCallback = then || null; document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); const cb = modalCallback; modalCallback = null; if (cb) setTimeout(cb, 300); }
function showFinal() { state.finished = true; state.rolling = false; showModal({ title: 'Космическое сознание', sanskrit: 'ब्रह्मन्', text: 'Вы вернулись в клетку 68. Игра завершена.', move: 'नमस्ते', color: '#e8c46a', then: () => { document.getElementById('dice').disabled = true; document.getElementById('dice-label').textContent = 'Игра завершена'; } }); }

async function newGame() {
    const btn = document.getElementById('restart');
    btn.disabled = true;
    try {
        const adTimeout = new Promise((resolve) => setTimeout(() => resolve(false), 5000));
        await Promise.race([showRewardedAd(), adTimeout]);
    } catch (e) {
        console.warn('Ошибка рекламы:', e);
    } finally {
        state = { pos: START_CELL, turns: 0, rolling: false, finished: false, entered: false, sixStreak: 0, pendingMove: 0 };
        document.getElementById('pos').textContent = START_CELL;
        document.getElementById('turns').textContent = 0;
        document.getElementById('dice').disabled = false;
        document.getElementById('dice-label').textContent = 'Бросьте 6';
        renderDice(1);
        updatePlayerPosition();
        updateChakraBar();
        document.getElementById('modal').classList.remove('show');
        modalCallback = null;
        btn.disabled = false;
    }
}

document.getElementById('dice').addEventListener('click', rollDice);
document.getElementById('mBtn').addEventListener('click', closeModal);
document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

buildBoard(); renderDice(1);
