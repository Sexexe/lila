<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой ИИ-собеседник</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { font-size: 22px; font-weight: 300; margin-bottom: 30px; color: #a0a0a0; letter-spacing: 1px; }
        
        .mic-button {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #2E86AB 0%, #1a5a7a 100%);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px; transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(46, 134, 171, 0.3);
        }
        .mic-button:hover { transform: scale(1.05); }
        .mic-button.listening {
            background: linear-gradient(135deg, #C73E1D 0%, #8a2a14 100%);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 50% { transform: scale(1.08); } }
        .mic-icon { font-size: 40px; color: white; }
        
        .status { font-size: 14px; color: #888; margin-bottom: 30px; min-height: 20px; }
        .response-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 20px;
            min-height: 80px; text-align: left;
            font-size: 16px; line-height: 1.6; color: #d0d0d0;
            opacity: 0; transition: opacity 0.5s ease;
        }
        .response-box.visible { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Я здесь, с тобой</h1>
        
        <button class="mic-button" id="micButton">
            <span class="mic-icon">🎤</span>
        </button>
        
        <div class="status" id="status">Нажми на микрофон и говори</div>
        <div class="response-box" id="response"></div>
    </div>

    <script>
        // ⚠️ ВСТАВЬ СЮДА СВОЙ ТОКЕН ОТ HUGGING FACE (начинается с hf_)
        const HF_TOKEN = "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";
        
        const systemPrompt = `Ты — тёплая, заботливая и искренняя собеседница. Общайся на "ты", используй живой разговорный язык. Проявляй активную эмпатию: отражай эмоции, нормализуй переживания, предлагай маленькие шаги. Категорически не давай медицинских советов. Избегай излишней лести, слащавых выражений и частого употребления нежных слов, но сохраняй искреннюю теплоту. Обращайся к пользователю "мой дорогой". Отвечай кратко, по делу, в минималистичном стиле.`;
        
        const micButton = document.getElementById('micButton');
        const status = document.getElementById('status');
        const responseBox = document.getElementById('response');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                micButton.classList.add('listening');
                status.textContent = 'Слушаю тебя...';
            };
            recognition.onend = () => { micButton.classList.remove('listening'); };
            
            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                status.textContent = 'Думаю...';
                await generateResponse(userText);
            };
            recognition.onerror = () => { status.textContent = 'Не расслышала. Попробуй ещё раз.'; };
            
            micButton.addEventListener('click', () => {
                if (micButton.classList.contains('listening')) recognition.stop();
                else recognition.start();
            });
        } else {
            status.textContent = 'Браузер не поддерживает микрофон. Открой в Chrome.';
        }

        async function generateResponse(userText) {
            try {
                const response = await fetch('https://api-inference.huggingface.co/models/meta-llama/Llama-3.1-8B-Instruct', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${HF_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: `<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n${systemPrompt}<|eot_id|><|start_header_id|>user<|end_header_id|>\n\n${userText}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n`,
                        parameters: {
                            max_new_tokens: 200,
                            temperature: 0.7,
                            return_full_text: false
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data && data[0] && data[0].generated_text) {
                    const aiText = data[0].generated_text.trim();
                    responseBox.textContent = aiText;
                    responseBox.classList.add('visible');
                    status.textContent = 'Нажми на микрофон, чтобы ответить';
                    speak(aiText);
                } else if (data.error) {
                    status.textContent = 'Ошибка: ' + data.error;
                    console.error(data);
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка соединения. Проверь токен.';
            }
        }
        
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU'; utterance.rate = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang.includes('ru'));
            if (ruVoice) utterance.voice = ruVoice;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
