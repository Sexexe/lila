<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой собеседник</title>
    <!-- Подключаем магическую библиотеку Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { font-size: 22px; font-weight: 300; margin-bottom: 40px; color: #a0a0a0; letter-spacing: 1px; }
        
        .mic-button {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #2E86AB 0%, #1a5a7a 100%);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px; transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(46, 134, 171, 0.3);
        }
        .mic-button:hover { transform: scale(1.05); }
        .mic-button.listening {
            background: linear-gradient(135deg, #C73E1D 0%, #8a2a14 100%);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(199, 62, 29, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(199, 62, 29, 0); }
        }
        .mic-icon { font-size: 40px; }
        .status { font-size: 14px; color: #888; margin-bottom: 30px; min-height: 20px; }
        
        .response-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 20px;
            min-height: 80px; text-align: left;
            font-size: 16px; line-height: 1.6; color: #d0d0d0;
            opacity: 0; transition: opacity 0.5s ease;
        }
        .response-box.visible { opacity: 1; }
        .error-box {
            background: rgba(199, 62, 29, 0.1);
            border: 1px solid rgba(199, 62, 29, 0.3);
            border-radius: 12px; padding: 15px;
            margin-top: 20px; text-align: left;
            font-size: 14px; line-height: 1.5; color: #ff9999;
            display: none;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Я слушаю тебя</h1>
        
        <button class="mic-button" id="micButton">
            <span class="mic-icon">🎤</span>
        </button>
        
        <div class="status" id="status">Нажми на микрофон и говори</div>
        <div class="error-box" id="errorBox"></div>
        <div class="response-box" id="response"></div>
    </div>

    <script>
        const micButton = document.getElementById('micButton');
        const status = document.getElementById('status');
        const responseBox = document.getElementById('response');
        const errorBox = document.getElementById('errorBox');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        function hideError() { errorBox.style.display = 'none'; errorBox.textContent = ''; }
        function showError(message) { errorBox.style.display = 'block'; errorBox.textContent = message; }
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                hideError();
                micButton.classList.add('listening');
                status.textContent = 'Говори, я слушаю...';
            };
            
            recognition.onend = () => { micButton.classList.remove('listening'); };
            
            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                status.textContent = 'Думаю...';
                await getAIResponse(userText);
            };
            
            recognition.onerror = () => {
                status.textContent = 'Не расслышала. Попробуй ещё раз, мой дорогой.';
                micButton.classList.remove('listening');
            };
        } else {
            status.textContent = 'Твой браузер не поддерживает речь. Открой в Chrome.';
            micButton.disabled = true;
        }
        
        micButton.addEventListener('click', () => {
            if (micButton.classList.contains('listening')) recognition.stop();
            else recognition.start();
        });
        
        async function getAIResponse(userText) {
            try {
                // Магия Puter.js: отправляем запрос без ключей и прокси!
                const response = await puter.ai.chat([
                    {
                        role: "system",
                        content: "Ты — тёплая, заботливая и искренняя собеседница. Общайся на \"ты\", используй живой разговорный язык. Проявляй активную эмпатию: отражай эмоции, нормализуй переживания, предлагай маленькие шаги. Категорически не давай медицинских советов. Избегай излишней лести, слащавых выражений и частого употребления нежных слов, но сохраняй искреннюю теплоту. Обращайся к пользователю \"мой дорогой\". Отвечай кратко, по делу, в минималистичном стиле."
                    },
                    {
                        role: "user",
                        content: userText
                    }
                ], { model: "meta-llama/llama-3.1-70b-instruct" }); // Та самая умная Llama 3.1 70B

                // Достаём текст ответа
                let aiText = "";
                if (response.message && response.message.content) aiText = response.message.content;
                else if (typeof response === 'string') aiText = response;
                else if (response.text) aiText = response.text;
                else aiText = "Ответ получен, но формат не распознан.";
                
                responseBox.textContent = aiText;
                responseBox.classList.add('visible');
                status.textContent = 'Нажми на микрофон, чтобы ответить';
                speak(aiText);
                
            } catch (err) {
                console.error('Ошибка:', err);
                showError('Ошибка: ' + err.message);
                status.textContent = 'Произошла ошибка.';
            }
        }
        
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang.includes('ru') && v.name.includes('Google')) || 
                            voices.find(v => v.lang.includes('ru'));
            if (ruVoice) utterance.voice = ruVoice;
            
            window.speechSynthesis.speak(utterance);
        }
        
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>
